<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpeedX 3D</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #scoreContainer {
      position: fixed;
      top: 10px;
      right: 10px;
      text-align: right;
      font-family: "Orbitron", sans-serif;
      color: #00ffff;
      z-index: 10;
    }
    #score {
      font-size: 24px;
      text-shadow: 0 0 5px #00ffff;
    }
    #highScore {
      font-size: 16px;
      opacity: 0.8;
      text-shadow: 0 0 3px #00ffff;
    }
    #menu {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      color: #00ffff;
      font-family: "Orbitron", sans-serif;
      text-align: center;
      z-index: 20;
      padding-top: 200px;
    }
    #menu h1 { font-size: 48px; margin-bottom: 20px; text-shadow: 0 0 10px #00ffff; }
    #menu h3 { font-size: 24px; margin: 5px; text-shadow: 0 0 5px #00ffff; }
    #menu button {
      font-family: "Orbitron", sans-serif;
      font-size: 24px;
      padding: 10px 20px;
      background: #000;
      color: #00ffff;
      border: 2px solid #00ffff;
      cursor: pointer;
      text-shadow: 0 0 5px #00ffff;
    }
    #menu button:hover {
      background: #00ffff;
      color: #000;
    }
  </style>
</head>
<body>
  <div id="scoreContainer">
    <div id="score"></div>
    <div id="highScore"></div>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="menu">
    <h1>SpeedX 3D</h1>
    <h2>Game Over</h2>
    <h3 id="finalScore"></h3>
    <h3 id="finalHighScore"></h3>
    <button onclick="restartGame()">Restart</button>
  </div>
  <script type="module" src="speedx.js"></script>
  <script>
    window.addEventListener('load', () => startGame());
  </script>
</body>
</html>
